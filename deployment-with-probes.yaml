apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-probes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-probes
  template:
    metadata:
      labels:
        app: webapp-probes
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
