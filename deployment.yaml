apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-yaml
spec:
  replicas: 5
  selector:
    matchLabels:
      app: webapp-yaml
  template:
    metadata:
      labels:
        app: webapp-yaml
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
